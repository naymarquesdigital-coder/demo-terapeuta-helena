<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel · Helena Duarte</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"><link rel="icon" href="../img/logo-cacau.webp"><style>
:root{--bg:#F6EEE7;--card:#FFFDFB;--ink:#3A2620;--muted:#7A5E52;--brand:#A45E49;--soft:#EBD5C7;--line:#E4D3C7;--ok:#2F6B4A;--okbg:#DCEBDD;--pend:#8A4A39;--pendbg:#F3DCCD;--new:#F6E3C4;--grey:#C9B8AD;--okc:#5E9A76;--pendc:#D9A48F;--lostc:#A45E49}
*{box-sizing:border-box}
body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.serif,.top h1,.k b,.dayh,.bigp{font-family:'Cormorant Garamond',Georgia,serif}
.top{background:var(--bg);border-bottom:1px solid var(--line);padding:16px clamp(16px,4vw,48px);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top img{width:56px;height:56px;object-fit:contain}
.top h1{font-size:30px;font-weight:500;margin:0;line-height:1;letter-spacing:-.01em}
.top small{display:block;margin-top:6px;font:500 10.5px 'DM Sans',sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.sp{flex:1}.live{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:#4E9A6B;animation:p 1.6s infinite}@keyframes p{50%{opacity:.35}}
.wrap{max-width:1120px;margin:0 auto;padding:clamp(18px,3vw,32px) clamp(16px,4vw,48px)}
.strip{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:6px;padding:12px 18px;margin-bottom:22px;font-size:14px;flex-wrap:wrap}
.strip b{font-weight:600}.strip .lbl{font:500 10.5px 'DM Sans';letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.strip.flash{animation:fl 3.5s}@keyframes fl{0%,60%{background:var(--new)}100%{background:var(--card)}}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:transparent;border-radius:4px;padding:10px 20px;font:inherit;font-weight:500;color:var(--ink);cursor:pointer;transition:all .2s}
.tab:hover{border-color:var(--brand)}.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.bar h2{font:500 32px 'Cormorant Garamond',serif;margin:0}
.sel{border:1px solid var(--ink);background:var(--card);border-radius:4px;padding:9px 14px;font:inherit;font-weight:500;color:var(--ink);cursor:pointer}
.tag{font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-bottom:24px;border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}
.k{padding:18px 14px 18px 0}
.k span{font-size:13px;color:var(--muted)}.k b{display:block;font-size:44px;font-weight:500;line-height:1.05;margin-top:4px}
.k i{display:block;font-style:normal;font-size:12.5px;color:var(--muted);margin-top:4px}
.k .dl{font-weight:600}.dl.up{color:var(--ok)}.dl.dn{color:var(--pend)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;box-shadow:0 18px 50px rgba(58,38,32,.07)}
.box{padding:20px 22px}
.box h3{margin:0 0 4px;font:500 24px 'Cormorant Garamond',serif}
.box p.s{margin:0 0 16px;font-size:12.5px;color:var(--muted)}
.seg{display:flex;height:16px;border-radius:999px;overflow:hidden;background:var(--soft);margin-bottom:14px}
.seg div{height:100%;transition:width .5s}
.lg{display:grid;gap:8px;font-size:13.5px}
.lg div{display:flex;align-items:center;gap:8px}.lg em{width:10px;height:10px;border-radius:50%;flex:none}.lg span{flex:1}.lg strong{font-weight:600}
.acts{list-style:none;margin:0;padding:0}
.acts li{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line);font-size:14.5px;line-height:1.45}
.acts li:first-child{border-top:0}.acts li>div{flex:1}
.chip{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--pend);font-size:11.5px;font-weight:600}
.num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:700}
.rw{display:grid;grid-template-columns:96px 1fr 112px;gap:12px;align-items:center;font-size:13.5px;padding:7px 0}
.trk{height:10px;background:var(--soft);border-radius:999px;overflow:hidden}.trk div{height:100%;background:var(--brand);border-radius:999px}
.rw strong{text-align:right;font-weight:600}
.ritmo{display:flex;gap:6px 10px;flex-wrap:wrap;align-items:baseline;border-radius:6px;padding:12px 18px;margin-bottom:18px;font-size:14px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--grey)}.ritmo.acima{border-left-color:var(--okc)}.ritmo.abaixo{border-left-color:var(--lostc)}.ritmo span{color:var(--muted)}
.big{display:flex;align-items:baseline;gap:10px;margin:2px 0 10px}.bigp{font-size:44px;font-weight:500;line-height:1}.big span{font-size:13px;color:var(--muted)}.big .bigp{font-size:44px;color:var(--ink)}
.dayh{padding:12px 20px;background:var(--soft);font-weight:600;font-size:21px}
.item{display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center;padding:14px 20px;border-top:1px solid var(--line)}
.item.new{animation:fl 3.5s}
.hr{font:500 28px 'Cormorant Garamond',serif}.nm{font-weight:500}.mt{color:var(--muted);font-size:13px;margin-top:2px}
.badge{display:inline-block;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600}
.b-ok{background:var(--okbg);color:var(--ok)}.b-pend{background:var(--pendbg);color:var(--pend)}.b-off{background:#ECE4DE;color:var(--muted)}
.btn{border:1px solid var(--brand);background:transparent;color:var(--brand);border-radius:4px;padding:8px 14px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.btn:hover{background:var(--brand);color:#fff}.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:13px 20px;text-align:left;border-top:1px solid var(--line)}
th{background:var(--soft);font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);border-top:0;font-weight:500}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:500 26px 'Cormorant Garamond',serif;margin-bottom:6px}
.sub{margin:22px 0 10px;font:500 24px 'Cormorant Garamond',serif}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:26px;align-items:center;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.fr{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.reset{display:none;gap:6px}.reset input{padding:8px 10px;border:1px solid var(--line);border-radius:4px;font:inherit;width:130px;background:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.item{grid-template-columns:60px 1fr}.item .act{grid-column:1/-1}th:nth-child(n+4),td:nth-child(n+4){display:none}.rw{grid-template-columns:80px 1fr 64px}}
</style>
</head>
<body>
<div class="top">
  <img src="../img/logo-cacau.webp" alt="Logo de Helena Duarte"><div><h1>Helena Duarte</h1><small>Painel de gestão · demonstração</small></div>
  <div class="sp"></div>
  <div class="live"><span class="dot"></span><span id="upd">conectando…</span></div>
</div>
<div class="wrap">
  <div class="strip" id="strip"></div>
  <div class="tabs">
    <button class="tab on" data-t="resumo">Resumo</button>
    <button class="tab" data-t="analises">Análises</button>
    <button class="tab" data-t="agenda">Agenda</button>
    <button class="tab" data-t="clientes">Clientes</button>
    <button class="tab" data-t="pagamentos">Pagamentos</button>
  </div>
  <div id="view"></div>
  <div class="foot">
    <span>Dados de meses anteriores são exemplos fictícios. Os agendamentos feitos na página entram aqui na hora.</span>
    <span class="fr"><span id="msg"></span>
    <button class="btn" id="rbtn">Reiniciar demonstração</button>
    <span class="reset" id="rbox"><input id="rkey" type="password" placeholder="senha"><button class="btn dark" id="rok">Limpar</button></span></span>
  </div>
</div>
<script>
const API='https://n8n-n8n.zseubr.easypanel.host/webhook/demo-terapeuta';
const VAL=180;
const $=id=>document.getElementById(id);
const brl=v=>'R$ '+Math.round(v||0).toLocaleString('pt-BR');
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESF=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const SEM=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const DSEM=['Segunda','Terça','Quarta','Quinta','Sexta'];
const pct=(a,b)=>b?Math.round(a/b*100):0;

// ---------- Dados fictícios (exemplo) ----------
const HIST={
 1:{ag:56,re:47,ca:6,fa:3,pg:45,novos:9,rec:22,ret:7,sem:6,inv:600,ocup:[92,85,88,58,70],org:[['Anúncio',18,4],['Instagram',11,3],['Indicação',5,2],['Direto',3,0]]},
 2:{ag:52,re:42,ca:7,fa:3,pg:42,novos:7,rec:21,ret:5,sem:5,inv:560,ocup:[90,84,86,60,66],org:[['Anúncio',15,3],['Instagram',10,2],['Indicação',4,2],['Direto',2,0]]},
 3:{ag:49,re:40,ca:6,fa:3,pg:40,novos:6,rec:20,ret:4,sem:4,inv:520,ocup:[88,80,84,55,64],org:[['Anúncio',14,2],['Instagram',9,2],['Indicação',3,2],['Direto',2,0]]},
 4:{ag:44,re:35,ca:6,fa:3,pg:35,novos:5,rec:18,ret:3,sem:3,inv:480,ocup:[80,76,78,50,60],org:[['Anúncio',11,2],['Instagram',8,2],['Indicação',3,1],['Direto',2,0]]}
};
const NOMES=['Camila R.','Rafael M.','Juliana S.','Marcos T.','Beatriz L.','Felipe A.','Larissa P.','Gustavo C.','Renata D.','Thiago N.','Patrícia V.','Daniel F.'];
const HORAS=['09:00','10:00','11:00','14:00','15:00','16:00','17:00'];
const ORIG=['Instagram','Anúncio','Indicação','Anúncio','Instagram','Direto'];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hoje=new Date();

function gerarPassadas(){ // sessões fictícias do mês atual, do dia 1 até ontem (dias úteis)
  const out=[];let i=0;
  for(let d=1;d<hoje.getDate();d++){
    const dt=new Date(hoje.getFullYear(),hoje.getMonth(),d);const w=dt.getDay();if(w===0||w===6)continue;
    for(let k=0;k<2;k++){
      const st=(i%9===5)?'cancelada':(i%13===9)?'falta':'realizada';
      const recente=(hoje.getDate()-d)<=1;
      out.push({id:'f'+i,nome:NOMES[i%NOMES.length],telefone:`(22) 9****-${pad(10+i*7%90)}${pad(20+i*3%80)}`.slice(0,18),data:iso(dt),hora:HORAS[(i*3+k*2)%7],origem:ORIG[i%ORIG.length],interesse:'Sessão',status:st,pagamento:st==='realizada'?(recente&&i%2===0?'pendente':'pago'):null,fake:true});
      i++;
    }
  }
  return out;
}
const PASSADAS=gerarPassadas();
function origemNorm(o){o=(o||'').toLowerCase();if(/insta/.test(o))return 'Instagram';if(/an[uú]nc|ads|trafego|tráfego|meta|google/.test(o))return 'Anúncio';if(/indic/.test(o))return 'Indicação';return 'Direto'}

function diasUteis(y,m,ate){let n=0;const fim=new Date(y,m+1,0).getDate();for(let d=1;d<=Math.min(ate||fim,fim);d++){const w=new Date(y,m,d).getDay();if(w&&w<6)n++}return n}
function ritmo(m){ // compara o mês em andamento com o mesmo período do mês anterior
  const y=hoje.getFullYear(),mo=hoje.getMonth();
  const dec=Math.max(1,diasUteis(y,mo,hoje.getDate()-1));
  const totAtual=diasUteis(y,mo);
  const pm=new Date(y,mo-1,1),totPrev=diasUteis(pm.getFullYear(),pm.getMonth());
  const prev=HIST[1],f=dec/totPrev;
  const prevRe=prev.re*f,prevRec=prev.pg*VAL*f;
  const proj=Math.round(m.re/dec*totAtual);
  const razao=prevRe?m.re/prevRe:1;
  const nivel=razao>=1.05?'acima':razao>=0.9?'igual':'abaixo';
  return {dec,prevRe,prevRec,proj,razao,nivel,pmNome:MESF[pm.getMonth()],prev};
}

// ---------- Estado ----------
let tab='resumo',sel=0,dados={agendamentos:[],resumo:{}},vistos=null,busy=false,ultimo=null;
const mesRef=k=>new Date(hoje.getFullYear(),hoje.getMonth()-k,1);
const chaveMes=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);

function ao_vivo(){return dados.agendamentos||[]}
function mdata(k){
  if(k>0){const h=HIST[k];return Object.assign({k,cur:false},h,{recebido:h.pg*VAL,aReceber:(h.re-h.pg)*VAL,perdido:(h.ca+h.fa)*VAL,previsto:h.ag*VAL,pend:h.re-h.pg})}
  const chave=chaveMes(hoje);
  const live=ao_vivo().filter(r=>(r.data||'').startsWith(chave));
  const P=PASSADAS;
  const re=P.filter(x=>x.status==='realizada').length,ca=P.filter(x=>x.status==='cancelada').length,fa=P.filter(x=>x.status==='falta').length;
  const pgF=P.filter(x=>x.pagamento==='pago').length,penF=P.filter(x=>x.pagamento==='pendente').length;
  const lp=live.filter(r=>r.pagamento==='pago').length,ln=live.length-lp;
  const f=Math.max(.15,Math.min(1,P.length/HIST[1].re));
  const org=HIST[1].org.map(o=>[o[0],Math.round(o[1]*f),Math.round(o[2]*f)]);
  const novosLive=new Set(live.map(r=>(r.telefone||r.nome).toLowerCase())).size;
  live.forEach(r=>{const o=org.find(x=>x[0]===origemNorm(r.origem));o[1]++;o[2]++});
  return {k:0,cur:true,ag:P.length+live.length,re,ca,fa,pg:pgF+lp,novos:Math.round(HIST[1].novos*f)+novosLive,rec:Math.round(HIST[1].rec*f),ret:Math.round(HIST[1].ret*f),sem:HIST[1].sem,inv:Math.round(HIST[1].inv*f),ocup:HIST[1].ocup,org,
    recebido:(pgF+lp)*VAL,aReceber:(penF+ln)*VAL,perdido:(ca+fa)*VAL,previsto:(P.length+live.length)*VAL,pend:penF+ln,fut:live.length};
}

// ---------- Utilitários de DOM ----------
async function api(b){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok)throw 0;return r.json()}
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function dia(iso_){const [y,m,d]=iso_.split('-').map(Number);const w=new Date(Date.UTC(y,m-1,d)).getUTCDay();return `${SEM[w][0].toUpperCase()+SEM[w].slice(1)}, ${d} de ${MES[m-1]}`}
function badge(r){
  if(r.status==='cancelada')return el('span','badge b-off','Cancelada');
  if(r.status==='falta')return el('span','badge b-off','Faltou');
  return el('span','badge '+(r.pagamento==='pago'?'b-ok':'b-pend'),r.pagamento==='pago'?'Pago':'Pendente');
}
async function togglePag(r){
  busy=true;
  try{await api({acao:'atualizar',id:r.id,pagamento:r.pagamento==='pago'?'pendente':'pago'});await load(true)}catch(e){$('msg').textContent='Falha ao atualizar.'}
  busy=false;
}
function payBtn(r){const b=el('button','btn',r.pagamento==='pago'?'Desfazer':'Marcar como pago');b.onclick=()=>togglePag(r);return b}
function delta(cur,prev,inverse,suf){
  if(prev==null||!prev)return null;
  const d=Math.round((cur-prev)/prev*100);if(d===0)return null;
  const good=inverse?d<0:d>0;
  return el('span','dl '+(good?'up':'dn'),`${d>0?'▲':'▼'} ${Math.abs(d)}% ${suf?suf:'vs mês anterior'}`);
}
function legenda(items,total){
  const seg=el('div','seg');const lg=el('div','lg');
  items.forEach(([nome,val,cor,fmt])=>{
    const s=el('div');s.style.width=pct(val,total)+'%';s.style.background=cor;seg.append(s);
    const l=el('div');const e=el('em');e.style.background=cor;l.append(e,el('span',null,nome),el('strong',null,fmt+' · '+pct(val,total)+'%'));lg.append(l);
  });
  return [seg,lg];
}
function box(titulo,sub){const c=el('div','card box');c.append(el('h3',null,titulo));if(sub)c.append(el('p','s',sub));return c}

// ---------- Ações sugeridas ----------
function acoes(m){
  const a=[];
  if(m.cur){const r=ritmo(m);if(r.nivel==='abaixo')a.push([`O mês está abaixo do ritmo de ${r.pmNome}. Abra mais horários e avise os clientes que não voltaram.`,'Automação: reativação'])}
  const taxa=pct(m.ca+m.fa,m.ag);
  if(m.pend>0)a.push([`${m.pend} pagamento${m.pend>1?'s':''} pendente${m.pend>1?'s':''} (${brl(m.aReceber)}). Envie um lembrete de cobrança gentil.`,'Automação: lembrete de pagamento']);
  if(taxa>=10)a.push([`Faltas e cancelamentos estão em ${taxa}% das sessões. Confirme cada sessão no dia anterior.`,'Automação: confirmação por WhatsApp']);
  const idx=m.ocup.indexOf(Math.min(...m.ocup));
  if(m.ocup[idx]<65)a.push([`${DSEM[idx]} é o dia mais vazio (${m.ocup[idx]}% de ocupação). Divulgue esses horários ou abra uma condição especial.`,'Automação: aviso de vagas']);
  const tot=m.org.reduce((x,o)=>x+o[2],0),top=m.org.slice().sort((x,y)=>y[2]-x[2])[0];
  if(top&&tot>=3)a.push([`${top[0]} trouxe ${pct(top[2],tot)}% dos clientes novos. Vale manter esse canal ativo.`,'Origem dos clientes']);
  if(m.novos&&pct(m.ret,m.novos)<75)a.push([`Só ${pct(m.ret,m.novos)}% dos clientes novos voltaram para a segunda sessão. Faça um acompanhamento após a primeira.`,'Automação: pós-sessão']);
  if(m.sem>=3)a.push([`${m.sem} clientes estão sem retorno há 30 dias. Envie uma mensagem de reativação.`,'Automação: reativação']);
  return a.slice(0,4);
}

// ---------- Telas ----------
function renderResumo(v){
  const m=mdata(sel);
  const prev=(!m.cur&&sel+1<=4)?mdata(sel+1):null;
  const rtm=m.cur?ritmo(m):null;
  const d=mesRef(sel);
  const bar=el('div','bar');
  const s=el('select','sel');s.setAttribute('aria-label','Selecionar mês');
  for(let k=0;k<=4;k++){const o=el('option',null,MESF[mesRef(k).getMonth()]+' '+mesRef(k).getFullYear()+(k===0?' · em andamento':''));o.value=k;if(k===sel)o.selected=true;s.append(o)}
  s.onchange=()=>{sel=+s.value;render(new Set())};
  bar.append(s,el('span','tag',m.cur?'Atualiza a cada novo agendamento':'Mês fechado'));
  v.append(bar);
  const rt=m.cur?ritmo(m):null;
  if(rt){
    const dif=Math.round((rt.razao-1)*100);
    const txt=rt.nivel==='acima'?`Este mês está caminhando acima de ${rt.pmNome} (+${dif}% no mesmo período).`:rt.nivel==='igual'?`Este mês está no mesmo ritmo de ${rt.pmNome}.`:`Este mês está abaixo do ritmo de ${rt.pmNome} (${dif}% no mesmo período).`;
    const st=el('div','ritmo '+rt.nivel);st.append(el('b',null,txt),el('span',null,` No ritmo atual, fecha com cerca de ${rt.proj} sessões (${rt.pmNome} fechou com ${rt.prev.re}).`));v.append(st);
  }

  const k=el('div','kpis');
  const cards=[
    ['Sessões realizadas',m.re,`de ${m.ag} agendadas`,prev?delta(m.re,prev.re):rtm?delta(m.re,rtm.prevRe,false,'no mesmo período'):null],
    ['Recebido',brl(m.recebido),`${pct(m.recebido,m.previsto)}% do previsto`,prev?delta(m.recebido,prev.recebido):null],
    ['A receber',brl(m.aReceber),`${m.pend} ${m.pend===1?'sessão pendente':'sessões pendentes'}`,prev?delta(m.aReceber,prev.aReceber,true):null],
    ['Faltas e cancelamentos',pct(m.ca+m.fa,m.ag)+'%',`${brl(m.perdido)} que deixaram de entrar`,prev?delta(m.ca+m.fa,prev.ca+prev.fa,true):null]
  ];
  cards.forEach(([t,val,sub,dl])=>{const c=el('div','k');const i=el('i',null,sub);if(dl){i.append(document.createElement('br'),dl)}c.append(el('span',null,t),el('b',null,val),i);k.append(c)});
  v.append(k);

  const g=el('div','grid2');
  const b1=box('Financeiro',`Previsto no mês: ${brl(m.previsto)}`);
  legenda([['Recebido',m.recebido,'var(--okc)',brl(m.recebido)],['A receber',m.aReceber,'var(--pendc)',brl(m.aReceber)],['Deixou de entrar',m.perdido,'var(--lostc)',brl(m.perdido)]],m.previsto).forEach(x=>b1.append(x));
  const b2=box('Sessões',`${m.ag} agendadas no mês`);
  legenda([['Realizadas',m.re,'var(--okc)',m.re+''],['Canceladas',m.ca,'var(--pendc)',m.ca+''],['Faltas',m.fa,'var(--lostc)',m.fa+'']].concat(m.fut?[['A realizar',m.fut,'var(--grey)',m.fut+'']]:[]),m.ag).forEach(x=>b2.append(x));
  g.append(b1,b2);v.append(g);

  const b3=box('Ações sugeridas','Com base nos números de '+MESF[d.getMonth()]);
  const ul=el('ul','acts');
  acoes(m).forEach(([t,auto],i)=>{const li=el('li');const dv=el('div');dv.append(el('span',null,t),document.createElement('br'),el('span','chip',auto));li.append(el('span','num',i+1),dv);ul.append(li)});
  if(!ul.children.length)ul.append(el('li',null,'Tudo em ordem neste mês.'));
  b3.append(ul);v.append(b3);
}
function renderAnalises(v){
  const m=mdata(sel);
  const bar=el('div','bar');
  const s=el('select','sel');s.setAttribute('aria-label','Selecionar mês');
  for(let k=0;k<=4;k++){const o=el('option',null,MESF[mesRef(k).getMonth()]+' '+mesRef(k).getFullYear()+(k===0?' · em andamento':''));o.value=k;if(k===sel)o.selected=true;s.append(o)}
  s.onchange=()=>{sel=+s.value;render(new Set())};
  bar.append(s,el('span','tag','Valores de exemplo'));v.append(bar);

  const g=el('div','grid2');
  const bc=box('Clientes','Novos, recorrentes e quem voltou');
  legenda([['Novos',m.novos,'var(--brand)',m.novos+''],['Recorrentes',m.rec,'var(--okc)',m.rec+'']],m.novos+m.rec).forEach(x=>bc.append(x));
  const bg=el('div','big');bg.append(el('span','bigp',pct(m.ret,m.novos)+'%'),el('span',null,'dos novos voltaram para a 2ª sessão'));bc.append(bg);
  const sm=el('div','big');sm.append(el('span','bigp',m.sem+''),el('span',null,'clientes sem retorno há mais de 30 dias'));bc.append(sm);
  const bo=box('De onde vieram os novos clientes','Origem registrada no agendamento');
  const tot=m.org.reduce((x,o)=>x+o[2],0);
  m.org.slice().sort((x,y)=>y[2]-x[2]).forEach(o=>{const r=el('div','rw');const t=el('div','trk'),f=el('div');f.style.width=pct(o[2],tot)+'%';t.append(f);r.append(el('span',null,o[0]),t,el('strong',null,`${o[2]} · ${pct(o[2],tot)}%`));bo.append(r)});
  g.append(bc,bo);v.append(g);

  const bq=box('Ocupação por dia da semana','Horários preenchidos sobre os disponíveis');
  m.ocup.forEach((x,i)=>{const r=el('div','rw');const t=el('div','trk'),f=el('div');f.style.width=x+'%';t.append(f);r.append(el('span',null,DSEM[i]),t,el('strong',null,x+'%'));bq.append(r)});
  v.append(bq);
}
function agruparDia(lista,card,mostrarBtn,newIds){
  let cur='';
  lista.forEach(r=>{
    if(r.data!==cur){cur=r.data;card.append(el('div','dayh',dia(cur)))}
    const it=el('div','item'+(newIds&&newIds.has(r.id)?' new':''));
    const mid=el('div');mid.append(el('div','nm',r.nome),el('div','mt',`${r.interesse||'Sessão'} · ${r.telefone||''} · origem: ${r.origem||'direto'}`));
    const act=el('div','act');act.style.display='flex';act.style.gap='8px';act.style.alignItems='center';act.append(badge(r));if(mostrarBtn)act.append(payBtn(r));
    it.append(el('div','hr',r.hora),mid,act);card.append(it);
  });
}
function renderAgenda(v,newIds){
  const live=ao_vivo().map(r=>Object.assign({status:'realizada'},r));
  v.append(el('div','sub','Próximas sessões'));
  const c1=el('div','card');
  if(!live.length){const e=el('div','empty');e.append(el('b',null,'Nenhum agendamento novo'),el('span',null,'Quando alguém agendar pela página, aparece aqui na hora.'));c1.append(e)}
  else agruparDia(live,c1,true,newIds);
  v.append(c1);
  v.append(el('div','sub','Sessões anteriores'));
  const c2=el('div','card');
  if(!PASSADAS.length){const e=el('div','empty');e.append(el('span',null,'Sem sessões anteriores neste mês.'));c2.append(e)}
  else agruparDia(PASSADAS.slice().reverse(),c2,false);
  v.append(c2);
}
function renderTabela(v){
  const live=ao_vivo().map(r=>Object.assign({status:'realizada',live:true},r));
  const todos=live.slice().sort((x,y)=>(y.criado_em||'').localeCompare(x.criado_em||'')).concat(PASSADAS.slice().reverse());
  const card=el('div','card'),t=el('table'),hd=el('tr');
  (tab==='clientes'?['Cliente','WhatsApp','Interesse','Origem','Sessão']:['Cliente','Sessão','Valor','Status','']).forEach(h=>hd.append(el('th',null,h)));
  t.append(hd);
  if(tab==='clientes'){const vis=new Set();todos.forEach(r=>{const k=(r.telefone||r.nome).toLowerCase();if(vis.has(k))return;vis.add(k);const tr=el('tr');[r.nome,r.telefone,r.interesse,r.origem,`${dia(r.data)} ${r.hora}`].forEach(x=>tr.append(el('td',null,x||'')));t.append(tr)})}
  else todos.forEach(r=>{
    const tr=el('tr');tr.append(el('td',null,r.nome),el('td',null,`${dia(r.data)} ${r.hora}`),el('td',null,r.status==='realizada'?brl(r.valor||VAL):'–'));
    const c=el('td');c.append(badge(r));tr.append(c);const dd=el('td');if(r.live)dd.append(payBtn(r));tr.append(dd);t.append(tr);
  });
  card.append(t);v.append(card);
}
function renderStrip(newIds){
  const s=$('strip');s.replaceChildren();
  const a=ao_vivo();
  if(!a.length){s.append(el('span','lbl','Última atualização'),el('span',null,'Aguardando novo agendamento pela página…'));return}
  const r=a.slice().sort((x,y)=>(y.criado_em||'').localeCompare(x.criado_em||''))[0];
  s.append(el('span','lbl','Última atualização'));
  const t=el('span');t.append(el('b',null,'Novo agendamento: '),document.createTextNode(`${r.nome} · ${dia(r.data)}, ${r.hora}`));
  s.append(t);
  if(newIds&&newIds.size){s.classList.remove('flash');void s.offsetWidth;s.classList.add('flash')}
}
function render(newIds){
  renderStrip(newIds);
  const v=$('view');v.replaceChildren();
  if(tab==='resumo')renderResumo(v);
  else if(tab==='analises')renderAnalises(v);
  else if(tab==='agenda')renderAgenda(v,newIds);
  else renderTabela(v);
}
async function load(force){
  if(busy&&!force)return;
  try{
    const j=await api({acao:'agenda'});
    if(!j.ok)throw 0;
    const ids=new Set(j.agendamentos.map(r=>r.id));
    const nu=new Set();if(vistos)ids.forEach(i=>{if(!vistos.has(i))nu.add(i)});
    const mudou=!vistos||nu.size>0||JSON.stringify(j.agendamentos)!==JSON.stringify(dados.agendamentos);
    vistos=ids;dados=j;
    if(mudou||force)render(nu);
    $('upd').textContent='ao vivo · '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    $('msg').textContent='';
  }catch(e){$('upd').textContent='sem conexão';if(!vistos){render(new Set())}}
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');tab=b.dataset.t;render(new Set());
});
$('rbtn').onclick=()=>{$('rbox').style.display='flex';$('rbtn').style.display='none';$('rkey').focus()};
$('rok').onclick=async()=>{
  try{const j=await api({acao:'reiniciar',chave:$('rkey').value});
    $('msg').textContent=j.ok?'Demonstração reiniciada.':'Senha incorreta.';
    if(j.ok){vistos=null;await load(true)}
  }catch(e){$('msg').textContent='Falha ao reiniciar.'}
  $('rkey').value='';$('rbox').style.display='none';$('rbtn').style.display='';
};
render(new Set());load();setInterval(load,4000);
</script>
</body>
</html>
